<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session History — Ward Academy Journal Club</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b31942'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3EWA%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#0a3161" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Session history</h1>
        <p class="muted" id="tz-note"></p>
      </div>
    </div>

    <div class="stat-tiles mb" id="stats" style="display:none">
      <div class="stat-tile"><div class="num" id="st-sessions">0</div><div class="lbl">Sessions held</div></div>
      <div class="stat-tile"><div class="num" id="st-articles">0</div><div class="lbl">Articles discussed</div></div>
      <div class="stat-tile"><div class="num" id="st-members">0</div><div class="lbl">Members involved</div></div>
    </div>

    <label class="field" style="max-width:420px">Search
      <input type="text" id="search"
        placeholder="Article, specialty, study design or member name…" />
    </label>

    <div id="history-list" class="mt muted">Loading…</div>
  </main>

  <footer class="site">Ward Academy · Journal Club</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      let ctx;
      try { ctx = await WA.initAppPage("history"); } catch (e) { return; }
      const { user } = ctx;

      WA.tzInlineWidget($("tz-note"));

      let rows, confirmations, confMissing;
      try {
        rows = await WA.fetchAllAvailabilities();
        const c = await WA.fetchConfirmations();
        confirmations = c.map;
        confMissing = c.missing;
      }
      catch (err) { $("history-list").textContent = "Could not load: " + err.message; return; }

      /* Past sessions = slots in the last 12 months that had at least one
         presenter and have already finished. */
      const now = new Date();
      const lookback = new Date(now.getTime() - 365 * 86400000);
      const sessions = WA.groupOccurrences(WA.expandAvailabilities(rows, lookback, now))
        .filter((g) => g.presenters.length > 0 && g.date.getTime() + 3600000 <= now.getTime())
        .reverse(); // most recent first

      /* ---------- summary tiles ---------- */
      if (sessions.length) {
        const articleIds = new Set();
        const memberIds = new Set();
        for (const g of sessions) {
          g.presenters.forEach((p) => { if (p.article_id) articleIds.add(p.article_id); });
          g.all.forEach((a) => memberIds.add(a.user_id));
        }
        $("st-sessions").textContent = sessions.length;
        $("st-articles").textContent = articleIds.size;
        $("st-members").textContent = memberIds.size;
        $("stats").style.display = "";
      }

      /* ---------- rendering ---------- */

      function personLink(a) {
        return '<a href="profile.html?id=' + encodeURIComponent(a.user_id) + '">' +
          WA.esc(a.profile ? a.profile.full_name || "Member" : "Member") + "</a>";
      }

      function peopleLine(icon, label, list) {
        if (!list.length) return "";
        return '<p class="small" style="margin:4px 0 0">' + icon + " <strong>" + label + ":</strong> " +
          list.map(personLink).join(", ") + "</p>";
      }

      /* Any of the organizing roles can confirm a session — not just the host.
         The leads run the session too, and gating on `host` alone would leave a
         session nobody can confirm (and presenters without certificates) whenever
         the coordination slot was filled by a lead instead. */
      const ORGANIZER_ROLES = ["host", "scientific_lead", "clinical_lead"];
      function confirmArea(g) {
        const conf = confirmations.get(g.iso);
        const iAmOrganizer = ORGANIZER_ROLES.some((r) =>
          (g.byRole[r] || []).some((a) => a.user_id === user.id));
        if (conf) {
          const who = conf.confirmer ? conf.confirmer.full_name : "the organizing team";
          return '<div class="confirm-line ok">✓ <strong>Session confirmed</strong> by ' +
            WA.esc(who) + " — certificates available to presenters." +
            (conf.confirmed_by === user.id
              ? ' <button class="btn sm ghost" data-unconfirm="' + WA.esc(g.iso) + '">Undo</button>' : "") +
            "</div>";
        }
        if (iAmOrganizer) {
          return '<div class="confirm-line pend">⏳ <strong>Awaiting your confirmation.</strong> ' +
            "You were on the organizing team for this session — confirm it took place to unlock the presenters’ certificates." +
            '<div style="margin-top:8px"><button class="btn sm" data-confirm="' + WA.esc(g.iso) +
            '">✓ Confirm this session took place</button></div></div>';
        }
        return '<div class="confirm-line pend">⏳ Awaiting confirmation from the organizing team before certificates are issued.</div>';
      }

      function sessionCard(g) {
        let html = '<div class="card session-card has-presenter' + (g.hosts.length ? " has-host" : "") + '">';
        html += '<div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center">' +
          '<span class="session-when">' + WA.esc(WA.fmtDateTime(g.date)) + "</span>" +
          '<span class="count-pill">👥 ' + g.all.length + " participant" + (g.all.length === 1 ? "" : "s") + "</span>" +
          "</div>";
        for (const p of g.presenters) {
          const art = p.article;
          html += '<div class="article-block">';
          if (art) {
            const url = WA.safeUrl(art.article_url);
            html += "<h4>" + (url
              ? '<a href="' + WA.esc(url) + '" target="_blank" rel="noopener noreferrer">📄 ' + WA.esc(art.title) + " ↗</a>"
              : "📄 " + WA.esc(art.title)) + "</h4>" +
              '<div style="margin:6px 0">' +
              '<span class="chip red">' + WA.esc(art.study_design) + "</span>" +
              '<span class="chip">' + WA.esc(art.specialty) +
              (art.subspecialty ? " · " + WA.esc(art.subspecialty) : "") + "</span></div>" +
              '<p class="small" style="margin:0">' + WA.esc(art.summary) + "</p>";
          } else {
            html += '<p class="small muted" style="margin:0">Article details no longer available.</p>';
          }
          html += '<p class="small muted" style="margin:6px 0 0">Presented by ' + personLink(p) + "</p>";
          html += "</div>";
        }
        html += peopleLine("⭐", "Host", g.hosts);
        html += peopleLine("👥", "Attendees", g.attendees);
        if (!confMissing) html += confirmArea(g);
        html += "</div>";
        return html;
      }

      function searchable(g) {
        const bits = [];
        for (const a of g.all) if (a.profile) bits.push(a.profile.full_name);
        for (const p of g.presenters) if (p.article) {
          bits.push(p.article.title, p.article.specialty, p.article.subspecialty,
            p.article.study_design, p.article.summary);
        }
        return bits.join(" ").toLowerCase();
      }

      function monthKey(g) {
        const p = WA.zonedParts(g.date);
        return WA.MONTHS[p.m] + " " + p.y;
      }

      function render(filter) {
        const q = (filter || "").toLowerCase().trim();
        const list = q ? sessions.filter((g) => searchable(g).includes(q)) : sessions;
        if (!list.length) {
          $("history-list").innerHTML =
            '<div class="empty-state"><h3>' +
            (q ? "No past sessions match your search" : "No sessions held yet") + "</h3>" +
            (q ? "" : "<p>Once a slot with a presenter passes, it shows up here with the article and everyone who took part.</p>") +
            "</div>";
          return;
        }
        let html = "", lastMonth = "";
        for (const g of list) {
          const mk = monthKey(g);
          if (mk !== lastMonth) {
            html += '<h2 style="margin:18px 0 10px">' + WA.esc(mk) + "</h2>";
            lastMonth = mk;
          }
          html += sessionCard(g);
        }
        $("history-list").innerHTML = html;
        $("history-list").classList.remove("muted");
      }

      $("search").addEventListener("input", (e) => render(e.target.value));

      // Host confirms / un-confirms a session (event delegation — render rebuilds the list).
      $("history-list").addEventListener("click", async (e) => {
        const confirmBtn = e.target.closest("[data-confirm]");
        const undoBtn = e.target.closest("[data-unconfirm]");
        if (confirmBtn) {
          const iso = confirmBtn.getAttribute("data-confirm");
          confirmBtn.disabled = true;
          const { error } = await WA.client.from("session_confirmations")
            .insert({ slot_start: iso, confirmed_by: user.id });
          if (error) {
            WA.toast("Could not confirm: " + error.message, "error");
            confirmBtn.disabled = false;
            return;
          }
          confirmations.set(iso, { slot_start: iso, confirmed_by: user.id,
            confirmer: { full_name: (ctx.profile.full_name || "You") } });
          WA.toast("Session confirmed — presenters can now download their certificate.", "success");
          render($("search").value);
        } else if (undoBtn) {
          if (!confirm("Undo confirmation? Presenters’ certificates for this session will be withdrawn until confirmed again.")) return;
          const iso = undoBtn.getAttribute("data-unconfirm");
          const { error } = await WA.client.from("session_confirmations")
            .delete().eq("slot_start", iso);
          if (error) { WA.toast("Could not undo: " + error.message, "error"); return; }
          confirmations.delete(iso);
          WA.toast("Confirmation removed.", "success");
          render($("search").value);
        }
      });

      if (confMissing) {
        const warn = document.createElement("div");
        warn.className = "card";
        warn.style.cssText = "border-left:5px solid var(--red)";
        warn.innerHTML = "<strong>Session confirmation needs a one-time database update.</strong> " +
          "Run the <code>session_confirmations</code> section of <code>supabase/schema.sql</code> in the " +
          "Supabase SQL Editor to let hosts confirm sessions and issue certificates.";
        $("history-list").parentNode.insertBefore(warn, $("history-list"));
      }

      render("");
    })();
  </script>
</body>
</html>
