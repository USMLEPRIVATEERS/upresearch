<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Ward Academy Journal Club</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b31942'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3EWA%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#0a3161" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .crop-frame {
      width: 260px; height: 260px; max-width: 78vw; max-height: 78vw; margin: 0 auto;
      position: relative; overflow: hidden; border-radius: 50%;
      background: #0a1830; touch-action: none; cursor: grab; user-select: none;
      box-shadow: 0 0 0 3px var(--red), 0 0 0 9999px rgba(10, 22, 40, 0.25) inset;
    }
    .crop-frame:active { cursor: grabbing; }
    .crop-frame img { position: absolute; left: 0; top: 0; max-width: none; -webkit-user-drag: none; pointer-events: none; }
    .crop-hint { text-align: center; color: var(--muted); font-size: 0.82rem; margin: 10px 0 2px; }
    .crop-zoom { display: flex; align-items: center; gap: 10px; max-width: 300px; margin: 8px auto 0; }
    .crop-zoom input[type="range"] { flex: 1; accent-color: var(--red); }
  </style>
</head>
<body>
  <nav id="nav"></nav>
  <div id="crop-root"></div>

  <main class="container">
    <div id="loading" class="muted" style="padding-top:10px">Loading profile…</div>

    <div id="profile-view" class="hidden">
      <div class="card">
        <div style="display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap">
          <div style="display:flex; flex-direction:column; align-items:center; gap:6px">
            <span class="avatar avatar-lg" id="p-avatar">?</span>
            <button class="btn ghost sm hidden" id="photo-btn" style="padding:4px 10px; font-size:0.78rem">📷 Photo</button>
            <button class="btn ghost sm hidden" id="photo-remove" style="padding:2px 8px; font-size:0.72rem; color:var(--err)">Remove</button>
            <input type="file" id="photo-input" accept="image/*" class="hidden" />
          </div>
          <div style="flex:1; min-width:220px">
            <h1 id="p-name" style="margin-bottom:2px"></h1>
            <p class="muted" id="p-sub" style="margin-bottom:6px"></p>
            <p id="p-bio" class="small"></p>
            <p class="small muted" id="p-since"></p>
          </div>
          <button class="btn ghost sm hidden" id="edit-btn">✏️ Edit profile</button>
        </div>

        <form id="edit-form" class="hidden mt" style="border-top:1px solid var(--border); padding-top:16px">
          <div class="grid-2">
            <label class="field">Full name
              <input type="text" id="e-name" required />
            </label>
            <label class="field">Specialty / area of interest
              <input type="text" id="e-specialty" placeholder="e.g. Internal Medicine" />
            </label>
          </div>
          <label class="field">Institution / medical school
            <input type="text" id="e-institution" placeholder="e.g. FMUSP" />
          </label>
          <label class="field">Short bio
            <textarea id="e-bio" placeholder="Career stage, research interests, USMLE journey…"></textarea>
          </label>
          <div style="display:flex; gap:10px">
            <button type="submit" class="btn">Save</button>
            <button type="button" class="btn ghost" id="cancel-edit">Cancel</button>
          </div>
          <div class="form-error" id="edit-error"></div>
        </form>
      </div>

      <div class="card" id="rank-card" style="display:none">
        <h2>🏅 Rank</h2>
        <div id="rank-body"></div>
      </div>

      <div class="card">
        <h2>Journal club participation</h2>
        <p class="muted small">Counted from past slots that actually had a presenter
          (i.e., sessions that happened), over the last 12 months.</p>
        <div class="stat-tiles" id="stat-tiles"></div>
        <div id="ladder-progress" class="ladder-note" style="margin-top:14px; display:none"></div>
      </div>

      <div class="card">
        <h2>Upcoming commitments</h2>
        <div id="upcoming" class="muted small">—</div>
      </div>

      <div class="card">
        <h2>Articles submitted</h2>
        <div id="articles" class="muted small">—</div>
      </div>
    </div>
  </main>

  <footer class="site">Ward Academy · Journal Club</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      let ctx;
      try { ctx = await WA.initAppPage("profile"); } catch (e) { return; }
      const { user } = ctx;

      const params = new URLSearchParams(window.location.search);
      const profileId = params.get("id") || user.id;
      const isOwn = profileId === user.id;

      let profile, allRows, articles;
      try {
        const [pRes, aRes, artRes] = await Promise.all([
          WA.client.from("profiles").select("*").eq("id", profileId).maybeSingle(),
          WA.fetchAllAvailabilities(),
          WA.client.from("articles").select("*").eq("presenter_id", profileId)
            .order("created_at", { ascending: false }),
        ]);
        if (pRes.error) throw pRes.error;
        profile = pRes.data;
        allRows = aRes;
        articles = artRes.data || [];
      } catch (err) {
        $("loading").textContent = "Could not load profile: " + err.message;
        return;
      }
      if (!profile) { $("loading").textContent = "Member not found."; return; }

      $("loading").classList.add("hidden");
      $("profile-view").classList.remove("hidden");

      /* ---------- header ---------- */
      function paintHeader() {
        const av = profile.avatar;
        if (av && WA.AVATAR_RE.test(av)) {
          $("p-avatar").textContent = "";
          $("p-avatar").classList.add("avatar-img");
          $("p-avatar").style.backgroundImage = "url('" + av + "')";
        } else {
          $("p-avatar").classList.remove("avatar-img");
          $("p-avatar").style.backgroundImage = "";
          $("p-avatar").textContent = WA.initials(profile.full_name);
        }
        $("p-name").textContent = profile.full_name || "Member";
        $("p-sub").textContent = [profile.specialty, profile.institution].filter(Boolean).join(" · ") || "";
        $("p-bio").textContent = profile.bio || "";
        $("p-since").textContent = "Member since " + WA.fmtDate(new Date(profile.created_at));
        document.title = (profile.full_name || "Profile") + " — Ward Academy Journal Club";
      }
      paintHeader();

      /* ---------- stats ---------- */
      const absences = (await WA.fetchAbsences()).set;
      const stats = WA.computeStats(allRows, 365, absences)[profileId] || {};
      // Show a tile per role held, always including the ladder so the path is visible.
      const ALWAYS = ["presenter", "methods_checker", "question_reader", "attendee"];
      $("stat-tiles").innerHTML = ["presenter", "methods_checker", "question_reader", "attendee",
        "host", "scientific_lead", "clinical_lead"]
        .filter((r) => (stats[r] || 0) > 0 || ALWAYS.indexOf(r) !== -1)
        .map((r) => '<div class="stat-tile"><div class="num">' + (stats[r] || 0) + "</div>" +
          '<div class="lbl">' + WA.roleIcon(r) + " " + WA.esc(WA.roleLabel(r)) + "</div></div>")
        .join("");

      /* ---------- rank ----------
         Over everything the member has ever done, not the 12-month window the
         tiles use: a rank that fell as older work aged out would punish people
         for having been here longer. */
      (async function rankCard() {
        const allTime = WA.computeStats(allRows, 3650, absences)[profileId] || {};
        const scores = await WA.fetchResearchScores();
        if (scores.missing) return; // migration pending — no half-built rank
        const rank = WA.computeRank(allTime, scores.map[profileId]);
        const isMe = profileId === user.id;

        const rows = rank.lines.map((l) =>
          '<tr' + (l.penalty ? ' class="rank-penalty"' : "") + "><td>" + l.icon + " " +
          WA.esc(l.label) + "</td><td>" + l.count + " × " + l.each +
          "</td><td><b>" + (l.points > 0 ? "+" : "") + l.points + "</b></td></tr>").join("");

        $("rank-body").innerHTML =
          '<div class="rank-hero rank-' + rank.tier.key + '">' +
            '<span class="rank-ic">' + rank.tier.icon + "</span>" +
            "<div><div class='rank-name'>" + WA.esc(rank.tier.name) + "</div>" +
            "<div class='rank-pts'>" + rank.points + " points</div></div>" +
          "</div>" +
          (rank.next
            ? '<div class="rank-bar"><span style="width:' + rank.progress + '%"></span></div>' +
              '<p class="small muted" style="margin:6px 0 0">' + rank.toNext +
              " points to " + rank.next.icon + " " + WA.esc(rank.next.name) + ".</p>"
            : '<p class="small muted" style="margin:6px 0 0">Top of the ladder.</p>') +
          (rank.overdue
            ? '<p class="rank-warn">⚠️ ' + rank.overdue + " research task" +
              (rank.overdue === 1 ? " is" : "s are") + " past their deadline — that's " +
              rank.penalty + " points" +
              (isMe ? ", and it lifts as soon as you finish them." : " while they sit there.") + "</p>"
            : "") +
          (rows
            ? '<table class="rank-table"><tbody>' + rows + "</tbody></table>"
            : '<p class="small muted">No points yet — join a session and it starts here.</p>') +
          '<p class="small muted" style="margin-top:10px">Points follow the time something ' +
          "actually costs: presenting an article is an afternoon of reading, reading a question " +
          "is ten minutes. Sessions someone was marked absent from don't count.</p>";
        $("rank-card").style.display = "";
      })();

      /* Where this member is on the ladder, and what the next step is. */
      (function ladderProgress() {
        const el = $("ladder-progress");
        const done = WA.ROLE_LADDER.filter((r) => (stats[r] || 0) > 0);
        const next = WA.ROLE_LADDER.find((r) => !(stats[r] || 0));
        if (!stats.sessions) return; // no history yet — nothing meaningful to say
        const isMe = profileId === user.id;
        const who = isMe ? "You have" : (profile.full_name || "This member") + " has";
        const steps = WA.ROLE_LADDER.map((r) =>
          ((stats[r] || 0) > 0 ? "<b>" + WA.roleIcon(r) + " " + WA.esc(WA.roleLabel(r)) + "</b>"
                               : WA.esc(WA.roleLabel(r)))).join('<span class="ladder-arrow">→</span>');
        let msg;
        if (!next) {
          msg = who + " completed every step of the ladder — including presenting. " +
            (isMe ? "Consider mentoring someone taking their first turn." : "");
        } else if (done.length) {
          msg = who + " taken " + done.length + " of the 3 steps. Next up: <b>" +
            WA.esc(WA.roleLabel(next)) + "</b>" +
            (isMe ? ' — <a href="availability.html">sign up for it here</a>.' : ".");
        } else {
          msg = who + " attended but not taken a role yet. The easiest way in is <b>" +
            WA.esc(WA.roleLabel("question_reader")) + "</b>" +
            (isMe ? ' — <a href="availability.html">try it here</a>.' : ".");
        }
        el.innerHTML = '<div style="margin-bottom:6px">' + steps + "</div>" + msg;
        el.style.display = "";
      })();

      /* ---------- upcoming commitments ---------- */
      const now = new Date();
      const mine = allRows.filter((r) => r.user_id === profileId);
      const occs = WA.expandAvailabilities(mine, now, new Date(now.getTime() + 30 * 86400000))
        .sort((a, b) => a.date - b.date).slice(0, 12);
      $("upcoming").innerHTML = occs.length
        ? occs.map((o) =>
            "<div class='my-avail-item'><div><strong>" + WA.esc(WA.fmtDateTime(o.date)) + "</strong> " +
            WA.roleBadge(o.avail.role) +
            (o.avail.kind === "recurring" ? ' <span class="muted small">(weekly)</span>' : "") +
            "</div></div>"
          ).join("")
        : "No availability posted for the next 30 days.";

      /* ---------- articles (editable on own profile) ---------- */
      function articleView(a) {
        const url = WA.safeUrl(a.article_url);
        return '<div class="article-block" data-art="' + WA.esc(a.id) + '"><h4>' +
          (url ? '<a href="' + WA.esc(url) + '" target="_blank" rel="noopener noreferrer">📄 ' +
            WA.esc(a.title) + " ↗</a>" : "📄 " + WA.esc(a.title)) + "</h4>" +
          '<span class="chip red">' + WA.esc(a.study_design) + "</span>" +
          '<span class="chip">' + WA.esc(a.specialty) +
          (a.subspecialty ? " · " + WA.esc(a.subspecialty) : "") + "</span>" +
          '<p class="small" style="margin:6px 0 0">' + WA.esc(a.summary) + "</p>" +
          '<div class="art-actions">' + WA.articleLinkBtn(url) +
          (isOwn ? '<button class="btn sm ghost" data-edit-art="' + WA.esc(a.id) + '">✏️ Edit article</button>' : "") +
          "</div></div>";
      }

      function articleEditor(a) {
        const opts = WA.STUDY_DESIGNS.map((d) =>
          "<option" + (d === a.study_design ? " selected" : "") + ">" + WA.esc(d) + "</option>").join("");
        return '<div class="article-block" data-art="' + WA.esc(a.id) + '">' +
          '<label class="field">Title<input type="text" class="ea-title" value="' + WA.esc(a.title) + '" /></label>' +
          '<label class="field">Link<input type="url" class="ea-url" value="' + WA.esc(a.article_url) + '" /></label>' +
          '<div class="grid-2">' +
          '<label class="field">Study design<select class="ea-design">' + opts + "</select></label>" +
          '<label class="field">Specialty<input type="text" class="ea-specialty" value="' + WA.esc(a.specialty) + '" /></label>' +
          "</div>" +
          '<label class="field">Subspecialty<input type="text" class="ea-subspecialty" value="' + WA.esc(a.subspecialty || "") + '" /></label>' +
          '<label class="field">What caught your attention<textarea class="ea-summary">' + WA.esc(a.summary) + "</textarea></label>" +
          '<div style="display:flex; gap:8px">' +
          '<button class="btn sm" data-save-art="' + WA.esc(a.id) + '">Save</button>' +
          '<button class="btn sm ghost" data-cancel-art="' + WA.esc(a.id) + '">Cancel</button></div>' +
          '<div class="form-error ea-error"></div></div>';
      }

      function renderArticles() {
        $("articles").innerHTML = articles.length
          ? articles.map(articleView).join("")
          : "No articles submitted yet.";
        if (!isOwn) return;
        $("articles").querySelectorAll("[data-edit-art]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const a = articles.find((x) => x.id === btn.getAttribute("data-edit-art"));
            const block = $("articles").querySelector('[data-art="' + a.id + '"]');
            block.outerHTML = articleEditor(a);
            wireEditor(a);
          });
        });
      }

      function wireEditor(a) {
        const block = $("articles").querySelector('[data-art="' + a.id + '"]');
        block.querySelector("[data-cancel-art]").addEventListener("click", renderArticles);
        block.querySelector("[data-save-art]").addEventListener("click", async () => {
          const errBox = block.querySelector(".ea-error");
          errBox.textContent = "";
          const updates = {
            title: block.querySelector(".ea-title").value.trim(),
            article_url: block.querySelector(".ea-url").value.trim(),
            study_design: block.querySelector(".ea-design").value,
            specialty: block.querySelector(".ea-specialty").value.trim(),
            subspecialty: block.querySelector(".ea-subspecialty").value.trim(),
            summary: block.querySelector(".ea-summary").value.trim(),
          };
          if (!updates.title || !updates.article_url || !updates.specialty || !updates.summary) {
            errBox.textContent = "Title, link, specialty and summary are required."; return;
          }
          if (!WA.safeUrl(updates.article_url)) {
            errBox.textContent = "The article link must be a valid http(s) URL."; return;
          }
          const { error } = await WA.client.from("articles").update(updates).eq("id", a.id);
          if (error) { errBox.textContent = error.message; return; }
          Object.assign(a, updates);
          WA.toast("Article updated.", "success");
          renderArticles();
        });
      }

      renderArticles();

      /* ---------- editing (own profile only) ---------- */
      if (isOwn) {
        // --- profile photo upload (compressed to a tiny data URL) ---
        $("photo-btn").classList.remove("hidden");
        $("photo-btn").addEventListener("click", () => $("photo-input").click());
        $("photo-input").addEventListener("change", async () => {
          const file = $("photo-input").files && $("photo-input").files[0];
          $("photo-input").value = "";
          if (!file) return;
          if (!/^image\//.test(file.type)) { WA.toast("Please choose an image file.", "error"); return; }
          // Let the member frame the photo (drag + zoom) before saving.
          const dataUrl = await openCropper(file);
          if (!dataUrl) return;
          $("photo-btn").disabled = true;
          try {
            const { error } = await WA.client.from("profiles")
              .update({ avatar: dataUrl, updated_at: new Date().toISOString() }).eq("id", user.id);
            if (error) throw error;
            profile.avatar = dataUrl;
            paintHeader();
            WA.renderNav("profile", profile);
            WA.toast("Profile photo updated (" + Math.round(dataUrl.length / 1024) + " KB).", "success");
          } catch (err) {
            WA.toast(err.message || "Could not update photo.", "error");
          } finally {
            $("photo-btn").disabled = false;
            updatePhotoControls();
          }
        });

        /* Circular crop tool: drag to reposition, slider to zoom, then the
           visible circle is rendered to a 128px square JPEG. */
        function openCropper(file) {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onerror = () => { WA.toast("Could not read the file.", "error"); resolve(null); };
            reader.onload = () => {
              const img = new Image();
              img.onerror = () => { WA.toast("That image could not be loaded.", "error"); resolve(null); };
              img.onload = () => buildCropUI(img, resolve);
              img.src = reader.result;
            };
            reader.readAsDataURL(file);
          });
        }

        function buildCropUI(img, resolve) {
          const FRAME = Math.min(260, Math.floor(window.innerWidth * 0.78));
          const root = $("crop-root");
          root.innerHTML =
            '<div class="modal-backdrop"><div class="modal" style="max-width:360px">' +
            '<h3>Position your photo</h3>' +
            '<div class="crop-frame" id="crop-frame"><img id="crop-img" alt="" /></div>' +
            '<p class="crop-hint">Drag to reposition · use the slider to zoom</p>' +
            '<div class="crop-zoom">🔍<input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" /></div>' +
            '<div style="display:flex; gap:10px; margin-top:16px">' +
            '<button class="btn" id="crop-save">Save photo</button>' +
            '<button class="btn ghost" id="crop-cancel">Cancel</button></div>' +
            "</div></div>";

          const frameEl = $("crop-frame");
          frameEl.style.width = FRAME + "px"; frameEl.style.height = FRAME + "px";
          const imgEl = $("crop-img");
          imgEl.src = img.src;

          const cover = Math.max(FRAME / img.naturalWidth, FRAME / img.naturalHeight);
          let zoom = 1, ox = 0, oy = 0;
          const scale = () => cover * zoom;
          function clamp() {
            const dw = img.naturalWidth * scale(), dh = img.naturalHeight * scale();
            ox = Math.min(0, Math.max(FRAME - dw, ox));
            oy = Math.min(0, Math.max(FRAME - dh, oy));
          }
          function layout() {
            clamp();
            const s = scale();
            imgEl.style.width = (img.naturalWidth * s) + "px";
            imgEl.style.height = (img.naturalHeight * s) + "px";
            imgEl.style.left = ox + "px"; imgEl.style.top = oy + "px";
          }
          // start centred
          ox = (FRAME - img.naturalWidth * scale()) / 2;
          oy = (FRAME - img.naturalHeight * scale()) / 2;
          layout();

          // drag (mouse + touch via pointer events)
          let dragging = false, px = 0, py = 0;
          frameEl.addEventListener("pointerdown", (e) => {
            dragging = true; px = e.clientX; py = e.clientY;
            frameEl.setPointerCapture(e.pointerId);
          });
          frameEl.addEventListener("pointermove", (e) => {
            if (!dragging) return;
            ox += e.clientX - px; oy += e.clientY - py; px = e.clientX; py = e.clientY;
            layout();
          });
          frameEl.addEventListener("pointerup", () => { dragging = false; });
          frameEl.addEventListener("pointercancel", () => { dragging = false; });

          // zoom around the centre of the frame
          $("crop-zoom").addEventListener("input", (e) => {
            const cx = FRAME / 2, cy = FRAME / 2;
            const oldS = scale();
            const ix = (cx - ox) / oldS, iy = (cy - oy) / oldS;
            zoom = Number(e.target.value);
            const newS = scale();
            ox = cx - ix * newS; oy = cy - iy * newS;
            layout();
          });

          function close() { root.innerHTML = ""; }
          $("crop-cancel").addEventListener("click", () => { close(); resolve(null); });
          root.querySelector(".modal-backdrop").addEventListener("click", (e) => {
            if (e.target.classList.contains("modal-backdrop")) { close(); resolve(null); }
          });
          $("crop-save").addEventListener("click", () => {
            const s = scale();
            const sx = (-ox) / s, sy = (-oy) / s, ss = FRAME / s;
            const canvas = document.createElement("canvas");
            canvas.width = 128; canvas.height = 128;
            const cxt = canvas.getContext("2d");
            cxt.imageSmoothingQuality = "high";
            cxt.drawImage(img, sx, sy, ss, ss, 0, 0, 128, 128);
            close();
            resolve(WA.canvasToTinyJpeg(canvas));
          });
        }
        $("photo-remove").addEventListener("click", async () => {
          if (!confirm("Remove your profile photo?")) return;
          const { error } = await WA.client.from("profiles")
            .update({ avatar: null, updated_at: new Date().toISOString() }).eq("id", user.id);
          if (error) { WA.toast("Could not remove: " + error.message, "error"); return; }
          profile.avatar = null;
          paintHeader();
          WA.renderNav("profile", profile);
          updatePhotoControls();
          WA.toast("Profile photo removed.", "success");
        });
        function updatePhotoControls() {
          const has = profile.avatar && WA.AVATAR_RE.test(profile.avatar);
          $("photo-remove").classList.toggle("hidden", !has);
        }
        updatePhotoControls();

        $("edit-btn").classList.remove("hidden");
        $("edit-btn").addEventListener("click", () => {
          $("e-name").value = profile.full_name || "";
          $("e-specialty").value = profile.specialty || "";
          $("e-institution").value = profile.institution || "";
          $("e-bio").value = profile.bio || "";
          $("edit-form").classList.remove("hidden");
          $("edit-btn").classList.add("hidden");
        });
        $("cancel-edit").addEventListener("click", () => {
          $("edit-form").classList.add("hidden");
          $("edit-btn").classList.remove("hidden");
        });
        $("edit-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          $("edit-error").textContent = "";
          const updates = {
            full_name: $("e-name").value.trim(),
            specialty: $("e-specialty").value.trim(),
            institution: $("e-institution").value.trim(),
            bio: $("e-bio").value.trim(),
            updated_at: new Date().toISOString(),
          };
          const { error } = await WA.client.from("profiles").update(updates).eq("id", user.id);
          if (error) { $("edit-error").textContent = error.message; return; }
          Object.assign(profile, updates);
          paintHeader();
          WA.renderNav("profile", profile);
          $("edit-form").classList.add("hidden");
          $("edit-btn").classList.remove("hidden");
          WA.toast("Profile updated.", "success");
        });
      }
    })();
  </script>
</body>
</html>
