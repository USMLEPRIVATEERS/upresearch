<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Ward Academy Journal Club</title>
  <link rel="icon" type="image/jpeg" href="LOGO.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo-row">
        <img src="LOGO.jpeg" alt="UP Research — USMLE Privateers logo" />
        <h1>Set a new password</h1>
      </div>

      <div id="waiting">
        <p class="small muted">Validating your reset link…</p>
        <p class="small muted">If you landed here without clicking the link in your email,
          go back to <a href="index.html">the sign-in page</a> and use “Forgot your password?”.</p>
      </div>

      <form id="form-reset" class="hidden">
        <label class="field">New password
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required />
          <span class="hint">At least 8 characters.</span>
        </label>
        <label class="field">Confirm new password
          <input type="password" id="new-password2" autocomplete="new-password" minlength="8" required />
        </label>
        <button type="submit" class="btn block" id="reset-btn">Update password</button>
        <div class="form-error" id="reset-error"></div>
      </form>

      <div id="done" class="hidden">
        <p class="form-ok">Password updated! You are signed in.</p>
        <a class="btn block" href="home.html">Go to the Journal Club →</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      if (!WA.configured() || !WA.client) {
        $("waiting").innerHTML = "<p class='form-error'>Site not configured — see README.md.</p>";
        return;
      }

      document.querySelectorAll('input[type="password"]').forEach((inp) => {
        const t = document.createElement("button");
        t.type = "button";
        t.className = "pw-toggle";
        t.textContent = "Show";
        t.addEventListener("click", () => {
          const showing = inp.type === "text";
          inp.type = showing ? "password" : "text";
          t.textContent = showing ? "Show" : "Hide";
        });
        inp.insertAdjacentElement("afterend", t);
      });

      function showForm() {
        $("waiting").classList.add("hidden");
        $("form-reset").classList.remove("hidden");
      }

      // The recovery link signs the user in with a temporary session;
      // supabase-js parses the URL hash and emits PASSWORD_RECOVERY.
      WA.client.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) showForm();
      });
      // Also handle the case where the session was already established.
      WA.client.auth.getSession().then(({ data: { session } }) => {
        if (session) showForm();
      });

      $("form-reset").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("reset-error").textContent = "";
        const p1 = $("new-password").value, p2 = $("new-password2").value;
        if (p1 !== p2) { $("reset-error").textContent = "Passwords do not match."; return; }
        $("reset-btn").disabled = true;
        const { error } = await WA.client.auth.updateUser({ password: p1 });
        $("reset-btn").disabled = false;
        if (error) { $("reset-error").textContent = error.message; return; }
        $("form-reset").classList.add("hidden");
        $("done").classList.remove("hidden");
      });
    })();
  </script>
</body>
</html>
