<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — Ward Academy Journal Club</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23bf5700'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3EWA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Calendar</h1>
        <p class="muted" id="tz-note"></p>
      </div>
      <div class="seg" id="view-seg">
        <button type="button" data-view="week" class="active">Week</button>
        <button type="button" data-view="month">Month</button>
      </div>
    </div>

    <div class="cal-toolbar">
      <button class="btn sm ghost" id="prev-btn">←</button>
      <button class="btn sm ghost" id="today-btn">Today</button>
      <button class="btn sm ghost" id="next-btn">→</button>
      <h2 id="range-label"></h2>
    </div>

    <div id="cal-body" class="muted">Loading…</div>

    <div class="legend">
      <span><i class="i-host"></i> Host confirmed</span>
      <span><i class="i-pres"></i> Presenter confirmed (session on)</span>
      <span><i class="i-att"></i> Members available</span>
    </div>
  </main>

  <div id="modal-root"></div>

  <footer class="site">Ward Academy · Journal Club</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      try { await WA.initAppPage("calendar"); } catch (e) { return; }
      $("tz-note").textContent = "All times in your local timezone (" + WA.timezoneName() + ").";

      let rows;
      try { rows = await WA.fetchAllAvailabilities(); }
      catch (err) { $("cal-body").textContent = "Could not load: " + err.message; return; }

      let view = "week";
      let anchor = new Date(); // any date inside the displayed week/month
      anchor.setHours(0, 0, 0, 0);

      $("view-seg").addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        view = btn.getAttribute("data-view");
        document.querySelectorAll("#view-seg button").forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });
      $("prev-btn").onclick = () => { shift(-1); };
      $("next-btn").onclick = () => { shift(1); };
      $("today-btn").onclick = () => { anchor = new Date(); anchor.setHours(0,0,0,0); render(); };
      function shift(dir) {
        if (view === "week") anchor.setDate(anchor.getDate() + 7 * dir);
        else anchor.setMonth(anchor.getMonth() + dir, 1);
        render();
      }

      function groupsForRange(start, end) {
        return WA.groupOccurrences(WA.expandAvailabilities(rows, start, end));
      }

      function slotClass(g) {
        if (g.hosts.length && g.presenters.length) return "lvl-host";
        if (g.presenters.length) return "lvl-pres";
        if (g.hosts.length) return "lvl-host";
        return "lvl-att";
      }
      function slotMark(g) {
        let m = "👥" + g.all.length;
        if (g.hosts.length) m = "⭐ " + m;
        else if (g.presenters.length) m = "📄 " + m;
        return m;
      }

      /* ---------- week view ---------- */

      function renderWeek() {
        const start = new Date(anchor);
        start.setDate(start.getDate() - start.getDay()); // back to Sunday, local
        start.setHours(0, 0, 0, 0);
        const end = new Date(start.getTime() + 7 * 86400000 - 1);
        $("range-label").textContent = WA.fmtDate(start) + " — " + WA.fmtDate(new Date(end.getTime() - 86399999));

        const groups = groupsForRange(start, end);
        const byKey = new Map(); // "dayIndex-hour" (local) -> group
        const hoursUsed = new Set();
        for (const g of groups) {
          const dayIdx = Math.floor((g.date - start) / 86400000);
          const h = g.date.getHours();
          byKey.set(dayIdx + "-" + h, g);
          hoursUsed.add(h);
        }
        // Show a sensible default range, expanded to fit any data.
        let hMin = 7, hMax = 22;
        for (const h of hoursUsed) { if (h < hMin) hMin = h; if (h > hMax) hMax = h; }

        const todayStr = new Date().toDateString();
        let html = '<div class="cal-scroll"><table class="cal-week"><tr><th></th>';
        for (let d = 0; d < 7; d++) {
          const day = new Date(start.getTime() + d * 86400000);
          html += '<th class="' + (day.toDateString() === todayStr ? "today" : "") + '">' +
            WA.WEEKDAYS_SHORT[day.getDay()] + "<br/>" + (day.getMonth() + 1) + "/" + day.getDate() + "</th>";
        }
        html += "</tr>";
        for (let h = hMin; h <= hMax; h++) {
          html += '<tr><td class="hour-label">' + WA.hourLabel(h) + "</td>";
          for (let d = 0; d < 7; d++) {
            const g = byKey.get(d + "-" + h);
            html += g
              ? '<td class="cal-cell"><button class="cal-slot ' + slotClass(g) + '" data-slot="' + WA.esc(g.iso) + '">' + slotMark(g) + "</button></td>"
              : '<td class="cal-cell empty" data-day="' + d + '" data-hour="' + h + '" title="Add your availability at this time"></td>';
          }
          html += "</tr>";
        }
        html += "</table></div>";
        $("cal-body").innerHTML = html;
        wireSlotClicks(groups);

        // Clicking an empty cell jumps to the availability form pre-filled
        // with that date and hour.
        document.querySelectorAll(".cal-cell.empty").forEach((td) => {
          td.addEventListener("click", () => {
            const day = new Date(start.getTime() + Number(td.getAttribute("data-day")) * 86400000);
            day.setHours(Number(td.getAttribute("data-hour")), 0, 0, 0);
            if (day < new Date()) return; // past slots aren't bookable
            window.location.href = WA.slotHref(day);
          });
        });
      }

      /* ---------- month view ---------- */

      function renderMonth() {
        const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
        const gridStart = new Date(first);
        gridStart.setDate(gridStart.getDate() - gridStart.getDay());
        const gridEnd = new Date(gridStart.getTime() + 42 * 86400000 - 1);
        $("range-label").textContent = WA.MONTHS[anchor.getMonth()] + " " + anchor.getFullYear();

        const groups = groupsForRange(gridStart, gridEnd);
        const byDay = new Map(); // local yyyy-mm-dd -> groups[]
        for (const g of groups) {
          const k = g.date.getFullYear() + "-" + g.date.getMonth() + "-" + g.date.getDate();
          (byDay.get(k) || byDay.set(k, []).get(k)).push(g);
        }

        const todayStr = new Date().toDateString();
        let html = '<div class="cal-month">' +
          WA.WEEKDAYS_SHORT.map((d) => '<div class="dow">' + d + "</div>").join("");
        for (let i = 0; i < 42; i++) {
          const day = new Date(gridStart.getTime() + i * 86400000);
          const k = day.getFullYear() + "-" + day.getMonth() + "-" + day.getDate();
          const dayGroups = byDay.get(k) || [];
          const nHost = dayGroups.filter((g) => g.hosts.length).length;
          const nPres = dayGroups.filter((g) => g.presenters.length).length;
          const nOther = dayGroups.length - dayGroups.filter((g) => g.presenters.length || g.hosts.length).length;
          let dots = "";
          if (nHost) dots += '<span class="dot-line host">⭐ ' + nHost + " hosted</span>";
          if (nPres) dots += '<span class="dot-line pres">📄 ' + nPres + " session" + (nPres > 1 ? "s" : "") + "</span>";
          if (nOther) dots += '<span class="dot-line att">👥 ' + nOther + " open slot" + (nOther > 1 ? "s" : "") + "</span>";
          html += '<button type="button" class="cal-day' +
            (day.getMonth() !== anchor.getMonth() ? " other" : "") +
            (day.toDateString() === todayStr ? " today" : "") +
            '" data-day="' + day.toISOString() + '">' +
            '<span class="num">' + day.getDate() + "</span>" +
            '<span class="dots">' + dots + "</span></button>";
        }
        html += "</div>";
        $("cal-body").innerHTML = html;

        document.querySelectorAll(".cal-day").forEach((btn) => {
          btn.addEventListener("click", () => {
            const day = new Date(btn.getAttribute("data-day"));
            const k = day.getFullYear() + "-" + day.getMonth() + "-" + day.getDate();
            const dayGroups = byDay.get(k) || [];
            if (!dayGroups.length) {
              // Empty day → offer to add availability on that date.
              if (day >= new Date(new Date().setHours(0, 0, 0, 0))) {
                window.location.href = "availability.html?date=" +
                  day.getFullYear() + "-" + WA.pad(day.getMonth() + 1) + "-" + WA.pad(day.getDate());
              }
              return;
            }
            openModal(
              WA.fmtDate(day),
              dayGroups.sort((a, b) => a.date - b.date).map(groupDetail).join("<hr style='border:0;border-top:1px solid var(--border)'/>")
            );
          });
        });
      }

      /* ---------- slot detail modal ---------- */

      function personLink(a) {
        return '<a href="profile.html?id=' + encodeURIComponent(a.user_id) + '">' +
          WA.esc(a.profile ? a.profile.full_name || "Member" : "Member") + "</a>";
      }

      function groupDetail(g) {
        let html = "<p><strong>" + WA.hourRange(g.date.getHours()) + "</strong> · 👥 " +
          g.all.length + " member" + (g.all.length === 1 ? "" : "s") + "</p>";
        if (g.hosts.length)
          html += '<p class="small">⭐ <strong>Host:</strong> ' + g.hosts.map(personLink).join(", ") + "</p>";
        for (const p of g.presenters) {
          const art = p.article;
          html += '<div class="article-block"><strong>📄 Presenter:</strong> ' + personLink(p);
          if (art) {
            const url = WA.safeUrl(art.article_url);
            html += "<br/>" + (url
              ? '<a href="' + WA.esc(url) + '" target="_blank" rel="noopener noreferrer">' + WA.esc(art.title) + " ↗</a>"
              : WA.esc(art.title)) +
              '<br/><span class="chip red">' + WA.esc(art.study_design) + "</span>" +
              '<span class="chip">' + WA.esc(art.specialty) +
              (art.subspecialty ? " · " + WA.esc(art.subspecialty) : "") + "</span>" +
              '<p class="small" style="margin:6px 0 0">' + WA.esc(art.summary) + "</p>";
          }
          html += "</div>";
        }
        if (g.attendees.length)
          html += '<p class="small muted">Attendees: ' + g.attendees.map(personLink).join(", ") + "</p>";
        html += '<p class="small"><a href="' + WA.esc(WA.slotHref(g.date)) + '">Join this slot →</a></p>';
        return html;
      }

      function openModal(title, bodyHtml) {
        const root = $("modal-root");
        root.innerHTML = '<div class="modal-backdrop"><div class="modal">' +
          '<button class="modal-close" aria-label="Close">×</button>' +
          "<h3>" + WA.esc(title) + "</h3>" + bodyHtml + "</div></div>";
        root.querySelector(".modal-close").onclick = () => { root.innerHTML = ""; };
        root.querySelector(".modal-backdrop").addEventListener("click", (e) => {
          if (e.target.classList.contains("modal-backdrop")) root.innerHTML = "";
        });
      }

      function wireSlotClicks(groups) {
        const byIso = new Map(groups.map((g) => [g.iso, g]));
        document.querySelectorAll(".cal-slot").forEach((btn) => {
          btn.addEventListener("click", () => {
            const g = byIso.get(btn.getAttribute("data-slot"));
            if (g) openModal(WA.fmtDateTime(g.date), groupDetail(g));
          });
        });
      }

      function render() { view === "week" ? renderWeek() : renderMonth(); }
      render();
    })();
  </script>
</body>
</html>
