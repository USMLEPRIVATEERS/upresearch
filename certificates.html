<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificates — Ward Academy Journal Club</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b31942'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3EWA%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#0a3161" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* The certificate is a fixed A4-landscape canvas so it always prints on
       exactly one page and can be rasterized to an image of the same shape. */
    #cert-viewer { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 120;
      background: rgba(10, 22, 40, 0.72); overflow-y: auto; padding: 18px 12px 60px; -webkit-overflow-scrolling: touch; }
    #cert-toolbar { max-width: 1050px; margin: 0 auto 12px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
    .cert-scaler { max-width: 1050px; margin: 0 auto; overflow: hidden; }
    .cert-stage { transform-origin: top left; }

    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      nav, footer, main, #cert-toolbar, #wa-toasts { display: none !important; }
      body { background: #fff !important; margin: 0 !important; }
      #cert-viewer { position: static !important; background: #fff !important; padding: 0 !important; overflow: visible !important; }
      .cert-scaler { max-width: none !important; overflow: visible !important; height: auto !important; }
      .cert-stage, #cert-mount { transform: none !important; }
    }
  </style>
</head>
<body>
  <nav id="nav"></nav>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Certificates</h1>
        <p class="muted" id="intro">Download an official certificate for each article you have presented
          at the Ward Academy Journal Club. Certificates are issued once the session’s host confirms it
          took place — you can <strong>Download</strong> the image or <strong>Print / Save as PDF</strong>.</p>
      </div>
    </div>

    <div id="cert-list" class="muted">Loading…</div>
  </main>

  <div id="cert-viewer" class="hidden">
    <div id="cert-toolbar">
      <button class="btn" id="download-btn">⬇ Download</button>
      <button class="btn secondary" id="print-btn">🖨 Print / Save as PDF</button>
      <button class="btn ghost" id="close-btn" style="background:#fff">Close</button>
    </div>
    <div class="cert-scaler"><div class="cert-stage" id="cert-mount"></div></div>
  </div>

  <footer class="site">Ward Academy · Journal Club</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      let ctx;
      try { ctx = await WA.initAppPage("certificates"); } catch (e) { return; }
      const { user, profile } = ctx;

      // Signatory (fixed) — the person who can confirm/verify a certificate.
      const SIGNATORY = {
        name: "Fernando de Nigris Vasconcellos",
        role: "Neurosurgery Pre-Residency Fellowship · Boston Medical Center",
        email: "fernando.vasconcellos@bmc.org",
      };

      let rows, confirmations;
      try {
        rows = await WA.fetchAllAvailabilities();
        confirmations = (await WA.fetchConfirmations()).map;
      }
      catch (err) { $("cert-list").textContent = "Could not load: " + err.message; return; }

      const now = new Date();
      const lookback = new Date(now.getTime() - 365 * 86400000);
      const allMine = WA.groupOccurrences(WA.expandAvailabilities(rows, lookback, now))
        .filter((g) => g.date.getTime() + 3600000 <= now.getTime() &&
          g.presenters.some((p) => p.user_id === user.id))
        .reverse()
        .map((g) => {
          const row = g.presenters.find((p) => p.user_id === user.id);
          return { date: g.date, iso: g.iso, article: row.article, confirmed: confirmations.has(g.iso) };
        })
        .filter((c) => c.article);
      const mine = allMine.filter((c) => c.confirmed);
      const pending = allMine.filter((c) => !c.confirmed);

      function refId(iso, articleId) {
        const s = user.id + "|" + iso + "|" + (articleId || "");
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
        const year = new Date(iso).getUTCFullYear();
        return "WAJC-" + year + "-" + h.toString(36).toUpperCase().padStart(7, "0").slice(0, 7);
      }
      function formalDate(d) {
        const p = WA.zonedParts(d);
        return WA.MONTHS[p.m] + " " + p.d + ", " + p.y;
      }

      /* ---------- self-contained certificate (fixed A4 landscape) ---------- */
      const CW = 1050, CH = 730; // px — fits A4 landscape at 96dpi with 8mm margins

      function certStyle() {
        return "<style>" +
          ".wa-cert{box-sizing:border-box;width:" + CW + "px;height:" + CH + "px;background:#fff;" +
          "color:#1c2536;font-family:Georgia,'Times New Roman',serif;position:relative;border:3px solid #0a3161;padding:9px;}" +
          ".wa-cert *{box-sizing:border-box;}" +
          ".wa-fr{height:100%;border:1.5px solid #b31942;padding:24px 44px;display:flex;flex-direction:column;}" +
          ".wa-hd{display:flex;align-items:center;justify-content:center;gap:13px;}" +
          ".wa-em{width:52px;height:52px;border-radius:50%;background:#0a3161;color:#fff;display:flex;align-items:center;" +
          "justify-content:center;font-weight:800;font-size:1.3rem;border:3px solid #b31942;}" +
          ".wa-org{text-align:left;line-height:1.1;}" +
          ".wa-o1{font-weight:700;font-size:1.05rem;color:#0a3161;letter-spacing:.5px;}" +
          ".wa-o2{font-size:.62rem;letter-spacing:2.5px;text-transform:uppercase;color:#b31942;font-weight:700;font-family:Arial,sans-serif;}" +
          ".wa-kick{text-align:center;letter-spacing:3px;text-transform:uppercase;font-size:.62rem;color:#64748b;margin:14px 0 0;font-family:Arial,sans-serif;}" +
          ".wa-title{text-align:center;font-weight:800;font-size:2.15rem;color:#0a3161;line-height:1.05;margin:2px 0 0;}" +
          ".wa-rule{width:104px;height:3px;background:#b31942;margin:9px auto 12px;}" +
          ".wa-cert p{margin:0;}" +
          ".wa-say{text-align:center;color:#43506a;font-size:.9rem;}" +
          ".wa-name{text-align:center;font-weight:700;font-size:1.85rem;color:#0a3161;margin:7px auto 4px;" +
          "padding-bottom:8px;border-bottom:1px solid #d7deea;display:inline-block;}" +
          ".wa-namew{text-align:center;}" +
          ".wa-body{text-align:center;color:#2c374d;font-size:.94rem;line-height:1.55;margin:12px auto 0;max-width:820px;}" +
          ".wa-art{font-style:italic;font-weight:700;color:#0a3161;}" +
          ".wa-tags{font-family:Arial,sans-serif;font-size:.76rem;color:#64748b;}" +
          ".wa-desc{text-align:center;font-family:Arial,sans-serif;font-size:.72rem;color:#5a6678;line-height:1.5;" +
          "margin:12px auto 0;max-width:830px;}" +
          ".wa-foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-top:14px;}" +
          ".wa-sign{text-align:center;min-width:280px;}" +
          ".wa-sname{font-weight:700;font-size:1rem;color:#0a3161;border-top:1.5px solid #0a3161;padding-top:5px;}" +
          ".wa-srole{font-family:Arial,sans-serif;font-size:.68rem;color:#64748b;margin-top:2px;}" +
          ".wa-semail{font-family:Arial,sans-serif;font-size:.68rem;color:#b31942;margin-top:1px;}" +
          ".wa-seal{width:78px;height:78px;border-radius:50%;border:3px double #b31942;display:flex;flex-direction:column;" +
          "align-items:center;justify-content:center;color:#b31942;flex-shrink:0;text-align:center;}" +
          ".wa-seal .s1{font-size:1.3rem;line-height:1;}.wa-seal .s2{font-size:.44rem;letter-spacing:1px;text-transform:uppercase;font-weight:700;font-family:Arial,sans-serif;}" +
          ".wa-meta{text-align:right;font-family:Arial,sans-serif;font-size:.66rem;color:#64748b;line-height:1.6;}" +
          ".wa-meta b{color:#43506a;}" +
          "</style>";
      }

      function certInner(c) {
        const name = (profile.full_name || "").trim();
        const art = c.article;
        const ref = refId(c.iso, art.id);
        const tags = [art.study_design, art.specialty, art.subspecialty].filter(Boolean).join(" · ");
        return '<div class="wa-fr">' +
          '<div class="wa-hd"><span class="wa-em">WA</span>' +
          '<div class="wa-org"><div class="wa-o1">Ward Academy</div>' +
          '<div class="wa-o2">Journal Club · USMLE Privateers</div></div></div>' +
          '<div class="wa-kick">Certificate of Presentation</div>' +
          '<div class="wa-title">Certificate of Presentation</div>' +
          '<div class="wa-rule"></div>' +
          '<p class="wa-say">This is to certify that</p>' +
          '<div class="wa-namew"><span class="wa-name">' +
          (name ? WA.esc(name) : "____________________") + "</span></div>" +
          '<p class="wa-body">delivered a presentation and critical appraisal of the scientific article ' +
          '<span class="wa-art">“' + WA.esc(art.title) + '”</span>' +
          (tags ? '<br><span class="wa-tags">' + WA.esc(tags) + "</span>" : "") +
          " at the <b>Ward Academy Journal Club</b> on <b>" + WA.esc(formalDate(c.date)) + "</b>, " +
          "engaging in the scholarly discussion and appraisal of the medical literature in English.</p>" +
          '<p class="wa-desc">This activity reflects the participant’s contribution to evidence-based ' +
          "medicine and the promotion of scientific research and dissemination within the USMLE Privateers " +
          "community. It may be listed as a scholarly / research-related experience (e.g., on ERAS); its " +
          "authenticity can be verified with the signatory below, who maintains a record of each participant’s presentations.</p>" +
          '<div class="wa-foot">' +
          '<div class="wa-sign"><div class="wa-sname">' + WA.esc(SIGNATORY.name) + "</div>" +
          '<div class="wa-srole">' + WA.esc(SIGNATORY.role) + "</div>" +
          '<div class="wa-semail">' + WA.esc(SIGNATORY.email) + "</div></div>" +
          '<div class="wa-seal"><span class="s1">★</span><span class="s2">Ward<br>Academy</span></div>' +
          '<div class="wa-meta"><b>Reference:</b> ' + WA.esc(ref) + "<br>" +
          "<b>Issued:</b> " + WA.esc(formalDate(now)) + "<br>" +
          "<b>Verify:</b> " + WA.esc(SIGNATORY.email) + "</div>" +
          "</div></div>";
      }

      function certNode(c) {
        return '<div class="wa-cert">' + certStyle() + certInner(c) + "</div>";
      }

      let current = null;

      function sizeStage() {
        const scaler = document.querySelector(".cert-scaler");
        if (!scaler || $("cert-mount").classList.contains("hidden")) return;
        const avail = scaler.clientWidth;
        const k = Math.min(1, avail / CW);
        $("cert-mount").style.transform = "scale(" + k + ")";
        scaler.style.height = (CH * k) + "px";
      }
      window.addEventListener("resize", sizeStage);

      function openCert(c) {
        current = c;
        if (!(profile.full_name || "").trim()) {
          WA.toast("Add your full name on your profile first so it appears on the certificate.", "error");
        }
        $("cert-mount").innerHTML = certNode(c);
        $("cert-viewer").classList.remove("hidden");
        document.body.style.overflow = "hidden";
        $("cert-viewer").scrollTop = 0;
        sizeStage();
      }
      function closeCert() {
        $("cert-viewer").classList.add("hidden");
        document.body.style.overflow = "";
      }
      $("close-btn").addEventListener("click", closeCert);
      $("print-btn").addEventListener("click", () => window.print());
      $("cert-viewer").addEventListener("click", (e) => { if (e.target.id === "cert-viewer") closeCert(); });

      function triggerDownload(href, filename, revoke) {
        const a = document.createElement("a");
        a.href = href; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(() => { if (revoke) URL.revokeObjectURL(href); a.remove(); }, 4000);
      }

      // A self-contained certificate document — opens to exactly one A4
      // landscape page and can be printed or saved as PDF. Always works.
      function downloadHtml(c) {
        const doc = "<!DOCTYPE html><html><head><meta charset='utf-8'>" +
          "<title>Ward Academy Certificate — " + WA.esc(refId(c.iso, c.article.id)) + "</title>" +
          "<style>@page{size:A4 landscape;margin:8mm}html,body{margin:0;padding:0;background:#fff}" +
          "body{display:flex;justify-content:center;padding:10px}</style></head><body>" +
          certNode(c) + "</body></html>";
        const blob = new Blob([doc], { type: "text/html" });
        triggerDownload(URL.createObjectURL(blob),
          "WardAcademy-Certificate-" + refId(c.iso, c.article.id) + ".html", true);
        WA.toast("Certificate downloaded — open it and use your browser’s “Save as PDF” or print.", "success");
      }

      /* Download — genuinely separate from print. Tries a PNG image first;
         if the browser blocks canvas export (SVG foreignObject taint), falls
         back to a self-contained printable HTML file, which always works. */
      $("download-btn").addEventListener("click", () => {
        if (!current) return;
        const c = current;
        try {
          const scale = 2;
          const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + CW + '" height="' + CH + '">' +
            '<foreignObject width="100%" height="100%">' +
            '<div xmlns="http://www.w3.org/1999/xhtml">' + certNode(c) + "</div>" +
            "</foreignObject></svg>";
          const img = new Image();
          img.onload = function () {
            try {
              const canvas = document.createElement("canvas");
              canvas.width = CW * scale; canvas.height = CH * scale;
              const cx = canvas.getContext("2d");
              cx.fillStyle = "#fff"; cx.fillRect(0, 0, canvas.width, canvas.height);
              cx.scale(scale, scale); cx.drawImage(img, 0, 0);
              canvas.toBlob(function (blob) {
                if (!blob) return downloadHtml(c);
                triggerDownload(URL.createObjectURL(blob),
                  "WardAcademy-Certificate-" + refId(c.iso, c.article.id) + ".png", true);
                WA.toast("Certificate image downloaded.", "success");
              }, "image/png");
            } catch (e) { downloadHtml(c); }
          };
          img.onerror = function () { downloadHtml(c); };
          img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        } catch (e) {
          downloadHtml(c);
        }
      });

      /* ---------- list ---------- */
      function pendingCard(c) {
        const art = c.article;
        return '<div class="card tight" style="display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; opacity:0.85">' +
          "<div><strong>📄 " + WA.esc(art.title) + "</strong>" +
          '<div class="small muted">' + WA.esc([art.study_design, art.specialty].filter(Boolean).join(" · ")) +
          " · presented " + WA.esc(formalDate(c.date)) + "</div>" +
          '<div class="small" style="color:#43506a; margin-top:4px">⏳ Awaiting host confirmation that the ' +
          'session took place — the certificate unlocks once the host confirms it in <a href="history.html">History</a>.</div></div>' +
          '<button class="btn sm ghost" disabled>🔒 Locked</button></div>';
      }

      if (!mine.length && !pending.length) {
        $("cert-list").innerHTML =
          '<div class="empty-state"><h3>No certificates yet</h3>' +
          "<p>Once you present an article at a Journal Club session <strong>and the host confirms " +
          "the session took place</strong>, an official certificate for that presentation will appear " +
          "here to download.</p>" +
          '<a class="btn" href="availability.html">Sign up to present</a></div>';
        return;
      }

      if (!(profile.full_name || "").trim()) {
        const warn = document.createElement("div");
        warn.className = "card";
        warn.style.cssText = "border-left:5px solid var(--red)";
        warn.innerHTML = '<strong>Add your full name first.</strong> Your certificates will show a blank ' +
          'name line until you set it on your <a href="profile.html">profile</a>.';
        $("cert-list").parentNode.insertBefore(warn, $("cert-list"));
      }

      $("cert-list").className = "";
      let listHtml = mine.map((c, i) => {
        const art = c.article;
        return '<div class="card tight" style="display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap">' +
          "<div><strong>📄 " + WA.esc(art.title) + "</strong>" +
          '<div class="small muted">' + WA.esc([art.study_design, art.specialty].filter(Boolean).join(" · ")) +
          " · presented " + WA.esc(formalDate(c.date)) + "</div></div>" +
          '<button class="btn sm" data-i="' + i + '">🎓 View certificate</button></div>';
      }).join("");
      if (pending.length) {
        listHtml += '<h2 style="margin:22px 0 10px; font-size:1.1rem">⏳ Awaiting host confirmation</h2>' +
          '<p class="muted small" style="margin:0 0 10px">These presentations are recorded, but the ' +
          "certificate is only issued after the session’s host confirms it actually took place.</p>" +
          pending.map(pendingCard).join("");
      }
      $("cert-list").innerHTML = listHtml;

      $("cert-list").querySelectorAll("[data-i]").forEach((btn) => {
        btn.addEventListener("click", () => openCert(mine[Number(btn.getAttribute("data-i"))]));
      });
    })();
  </script>
</body>
</html>
