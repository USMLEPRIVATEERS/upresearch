<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members — Ward Academy Journal Club</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b31942'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3EWA%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#0a3161" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Members <span class="count-pill" id="member-count" style="vertical-align:middle; font-size:0.8rem"></span></h1>
        <p class="muted">Everyone in the Ward Academy Journal Club. Click a member to see their profile
          and participation history.</p>
      </div>
    </div>

    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end">
      <label class="field" style="max-width:380px; flex:1 1 260px">Search
        <input type="text" id="search" placeholder="Name, specialty or institution…" />
      </label>
      <label class="field" style="max-width:220px">Order
        <select id="sort-members">
          <option value="name">By name</option>
          <option value="rank">🏅 By rank</option>
        </select>
      </label>
    </div>

    <div id="members-list" class="grid-3 mt muted">Loading…</div>
  </main>

  <footer class="site">Ward Academy · Journal Club</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      try { await WA.initAppPage("members"); } catch (e) { return; }

      let profiles = [], stats = {}, ranks = {};
      try {
        const [{ data, error }, rows] = await Promise.all([
          WA.client.from("profiles").select("*").order("full_name"),
          WA.fetchAllAvailabilities(),
        ]);
        if (error) throw error;
        profiles = data || [];
        // Absences are honoured so the counts reflect who actually attended.
        const abs = await WA.fetchAbsences();
        stats = WA.computeStats(rows, 365, abs.set);
        // Rank is all-time — it shouldn't drop because older work aged out of
        // the 12-month window the badges use.
        const allTime = WA.computeStats(rows, 3650, abs.set);
        const scores = await WA.fetchResearchScores();
        if (!scores.missing) {
          profiles.forEach((p) => {
            ranks[p.id] = WA.computeRank(allTime[p.id] || {}, scores.map[p.id]);
          });
        }
      } catch (err) {
        $("members-list").textContent = "Could not load members: " + err.message;
        return;
      }

      function card(p) {
        const s = stats[p.id] || {};
        return '<a class="card tight" style="text-decoration:none; color:inherit" ' +
          'href="profile.html?id=' + encodeURIComponent(p.id) + '">' +
          '<div class="member-card">' +
          WA.avatarHtml(p) +
          "<div><h3 style='margin:0'>" + WA.esc(p.full_name || "Member") + "</h3>" +
          '<div class="small muted">' + WA.esc(p.specialty || "—") +
          (p.institution ? " · " + WA.esc(p.institution) : "") + "</div>" +
          '<div class="stats">' +
          (ranks[p.id] ? WA.rankBadge(ranks[p.id]) : "") +
          // Only show the roles this member has actually held, so cards stay readable.
          ["presenter", "methods_checker", "question_reader", "host", "scientific_lead", "clinical_lead"]
            .filter((r) => (s[r] || 0) > 0)
            .map((r) => '<span class="badge ' + WA.ROLES[r].badge + '">' + WA.roleIcon(r) + " " +
              s[r] + " × " + WA.esc(WA.roleLabel(r)) + "</span>").join("") +
          // Every session they took part in, whatever role they held. The old
          // count was the attendee role alone, so someone who hosted forty
          // sessions and never sat in as a plain attendee read as "0 attended".
          '<span class="badge badge-attendee">👥 ' + (s.sessions || 0) +
            (s.sessions === 1 ? " session" : " sessions") + "</span>" +
          "</div></div></div></a>";
      }

      const totalCount = profiles.length;
      function render(filter) {
        const q = (filter || "").toLowerCase().trim();
        const list = profiles.filter((p) =>
          !q ||
          (p.full_name || "").toLowerCase().includes(q) ||
          (p.specialty || "").toLowerCase().includes(q) ||
          (p.institution || "").toLowerCase().includes(q)
        );
        if (sortBy === "rank") {
          list.sort((a, b) => ((ranks[b.id] || {}).points || 0) - ((ranks[a.id] || {}).points || 0) ||
            String(a.full_name || "").localeCompare(String(b.full_name || "")));
        }
        // Discreet total; shows "N of TOTAL" while a search is filtering.
        $("member-count").textContent = q
          ? "👥 " + list.length + " of " + totalCount
          : "👥 " + totalCount + (totalCount === 1 ? " member" : " members");
        $("members-list").innerHTML = list.length
          ? list.map(card).join("")
          : '<div class="empty-state" style="grid-column:1/-1">No members match your search.</div>';
      }

      let sortBy = "name";
      const sortSel = $("sort-members");
      if (sortSel) {
        sortSel.addEventListener("change", () => { sortBy = sortSel.value; render($("search").value); });
      }
      $("search").addEventListener("input", (e) => render(e.target.value));
      render("");
    })();
  </script>
</body>
</html>
